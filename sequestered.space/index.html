<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEQUESTERED.SPACE // HOME</title>
    <link rel="icon" href="/resources/soul-white-small.ico" type="image/x-icon">
    <style>
        :root { 
            --bg: #000; 
            --fg: #fff; 
            --accent-primary: #00f5ff; /* Electric Teal */
            --accent-secondary: #ffaa00; /* Sharp Amber */
            --border: #333;
        }

        body, html {
            background: var(--bg);
            color: var(--fg);
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            min-height: 100%;
            overflow-x: hidden;
        }

        #ascii-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            font-size: 10px; 
            line-height: 10px;
            color: var(--accent-primary);
            opacity: 1.0; 
            white-space: pre;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
            text-align: left;
        }

        .ui-layer {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: clamp(10px, 5vw, 40px);
            box-sizing: border-box;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, rgba(0,0,0,0) 0%, rgba(0,0,0,0.9) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .ui-layer * {
            pointer-events: auto;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            border-bottom: 2px solid var(--accent-primary);
            padding-bottom: 15px;
            gap: 10px;
        }

        .sys-info {
            font-size: clamp(0.5rem, 2vw, 0.7rem);
            color: var(--accent-primary);
            min-width: 120px;
        }

        .main-hero {
            text-align: center;
            margin: 48px 0 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .hero-logo {
            width: clamp(80px, 15vw, 150px);
            height: auto;
            filter: drop-shadow(0 0 10px rgba(0, 245, 255, 0.2));
        }

        .title-svg {
            width: clamp(280px, 80vw, 800px);
            height: auto;
        }

        .title-svg text {
            font-family: "Lucida Console", "Monaco", "Consolas", monospace;
            font-weight: 900;
            text-transform: lowercase;
        }

        .subtitle {
            color: var(--accent-secondary);
            font-size: clamp(0.6rem, 2vw, 0.8rem);
            letter-spacing: clamp(2px, 1vw, 8px);
            margin-top: 15px;
            text-transform: uppercase;
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding-bottom: 40px;
        }

        .project-card {
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(2px);
            text-decoration: none;
            color: var(--fg);
            transition: 0.3s;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .project-card:hover { 
            border-color: var(--accent-primary); 
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(0, 245, 255, 0.1);
        }

        .card-carousel { height: 200px; background: #111; position: relative; overflow: hidden; border-bottom: 1px solid var(--border); }
        .carousel-media { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; opacity: 0; transition: opacity 0.5s; }
        .carousel-media.active { opacity: 1; }
        .card-content { padding: 20px; }
        .card-index { font-size: 0.6rem; color: var(--accent-primary); display: block; margin-bottom: 10px; letter-spacing: 2px; }
        .card-title { font-weight: bold; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; }

        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            font-size: 0.6rem;
            color: #555;
            border-top: 1px solid var(--border);
            padding-top: 20px;
            margin-top: 40px;
            text-align: center;
        }

        .active-quote {
            color: var(--accent-secondary);
            font-style: italic;
            width: 100%;
            max-width: 600px;
        }

        .footer-meta {
            width: 100%;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div id="ascii-canvas"></div>

    <div class="ui-layer">
        <header>
            <div class="sys-info">CORE://CONWAY_LIFE<br>SOURCE://<span id="header-source-text">ARCHIVE</span><br>STATUS://EVOLVING</div>
            <div class="sys-info" style="text-align: right;">DATE://2026.07.21<br>LOC://SEQUESTERED_V2<br>AUTH://ELLIOT</div>
        </header>

        <div class="main-hero">
            <img src="./resources/soul-white-no-background.png" class="hero-logo" alt="Sequestered Logo" style="mix-blend-mode: screen;">
            <svg class="title-svg" viewBox="0 0 500 80">
                <defs>
                    <mask id="mask">
                        <rect width="100%" height="100%" fill="white" />
                        <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" font-size="42" fill="black">sequestered.space</text>
                    </mask>
                </defs>
                <rect width="100%" height="100%" fill="white" mask="url(#mask)" />
            </svg>
            <div class="subtitle">Technical Notes, Projects, and Research</div>
        </div>

        <div class="nav-grid" id="project-grid">
            <!-- Projects injected via JS -->
        </div>

        <footer>
            <div class="active-quote" id="footer-quote">"Patterns in the static."</div>
            <div class="sys-info">
              <span id="source-text">ARCHIVE</span>
            </div>
            <div class="footer-meta">
                <span>[ SYSTEM ACTIVE ]</span>
                <span>GEN: <span id="generation-count">0</span></span>
            </div>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('ascii-canvas');
        const genText = document.getElementById('generation-count');
        const footerQuote = document.getElementById('footer-quote');
        const sourceText = document.getElementById('source-text');
        const headerSourceText = document.getElementById('header-source-text');
        
        let allQuotesData = [];
        let combinedQuotes = "Sequestered observations of a digital void. Patterns in the static.";
        let cols, rows, grid = [], generation = 0;

        async function init() {
            // Perfect measure from the "Perfect" version
            const measure = document.createElement('span');
            measure.innerText = 'M';
            measure.style.font = '10px "Courier New", monospace';
            measure.style.visibility = 'hidden';
            measure.style.position = 'absolute';
            document.body.appendChild(measure);
            const charWidth = measure.offsetWidth || 7; 
            const charHeight = 10;
            document.body.removeChild(measure);

            cols = Math.floor(window.innerWidth / charWidth) + 1;
            rows = Math.floor(window.innerHeight / charHeight) + 1;

            try {
                const res = await fetch('./resources/quotes.json');
                const data = await res.json();
                allQuotesData = data;
                combinedQuotes = allQuotesData.map(q => q.text).join(" ").replace(/\s+/g, ' ');
                const randomQuoteObj = allQuotesData[Math.floor(Math.random() * allQuotesData.length)];
                footerQuote.innerText = `"${randomQuoteObj.text}"`;
                const normalizedAuthor = randomQuoteObj.author.toUpperCase().replace(/\s+/g, '_');
                sourceText.innerText = normalizedAuthor;
                headerSourceText.innerText = normalizedAuthor;
            } catch(e) { console.error("Quotes load failed", e); }
            
            initGrid();
            loop();
            loadProjects();
        }

        function initGrid() {
            grid = Array(cols).fill().map(() => Array(rows).fill(0).map(() => Math.random() > 0.9 ? 1 : 0));
        }

        function loop() {
            // Update
            let next = Array(cols).fill().map(() => Array(rows).fill(0));
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    let neighbors = 0;
                    for(let x=-1; x<2; x++) for(let y=-1; y<2; y++) {
                        neighbors += grid[(i+x+cols)%cols][(j+y+rows)%rows];
                    }
                    neighbors -= grid[i][j];
                    if (grid[i][j] == 0 && neighbors == 3) next[i][j] = 1;
                    else if (grid[i][j] == 1 && (neighbors < 2 || neighbors > 3)) next[i][j] = 0;
                    else next[i][j] = grid[i][j];
                }
            }
            grid = next; generation++; genText.innerText = generation;
            
            // Random spawning from the "Perfect" version
            if (generation % 100 === 0) {
                 for(let k=0; k<10; k++) {
                     const rx = Math.floor(Math.random()*cols);
                     const ry = Math.floor(Math.random()*rows);
                     if(grid[rx]) grid[rx][ry] = 1;
                 }
            }

            // Draw
            let out = "";
            for (let j = 0; j < rows; j++) {
                for (let i = 0; i < cols; i++) {
                    out += grid[i][j] ? combinedQuotes[(i + j * cols + generation) % combinedQuotes.length] : " ";
                }
                out += "\n";
            }
            canvas.innerText = out;
            setTimeout(loop, 100);
        }

        window.addEventListener('resize', () => {
            const measure = document.createElement('span');
            measure.innerText = 'M';
            measure.style.font = '10px "Courier New", monospace';
            measure.style.visibility = 'hidden';
            measure.style.position = 'absolute';
            document.body.appendChild(measure);
            const cw = measure.offsetWidth || 7; 
            document.body.removeChild(measure);
            cols = Math.floor(window.innerWidth / cw) + 1;
            rows = Math.floor(window.innerHeight / 10) + 1;
            initGrid();
        });

        // Perfect interaction logic
        document.addEventListener('mousemove', (e) => {
            const x = Math.floor((e.clientX / window.innerWidth) * cols);
            const y = Math.floor((e.clientY / window.innerHeight) * rows);
            if (x >= 0 && x < cols && y >= 0 && y < rows) {
                grid[x][y] = 1;
            }
        });

        init();

        async function loadProjects() {
            try {
                const res = await fetch('./resources/projects.json');
                const projects = await res.json();
                const gridElem = document.getElementById('project-grid');
                const videoExtensions = ['.mp4', '.webm', '.ogg'];

                function renderPreviewMedia(preview, isActive) {
                    const activeClass = isActive ? 'active' : '';
                    const lowerPreview = preview.toLowerCase();
                    const isVideo = videoExtensions.some(ext => lowerPreview.includes(ext));
                    if (isVideo) {
                        return `<video class="carousel-media ${activeClass}" muted playsinline preload="metadata"><source src="${preview}#t=0.1"></video>`;
                    }
                    return `<img src="${preview}" class="carousel-media ${activeClass}">`;
                }

                projects.forEach(p => {
                    const card = document.createElement('a');
                    card.href = p.url;
                    card.className = 'project-card';
                    let carouselHtml = '';
                    p.previews.forEach((preview, i) => {
                        carouselHtml += renderPreviewMedia(preview, i === 0);
                    });
                    card.innerHTML = `
                        <div class="card-carousel">${carouselHtml}</div>
                        <div class="card-content">
                            <span class="card-index">${p.index} // ${p.category}</span>
                            <span class="card-title">${p.title}</span>
                        </div>
                    `;
                    gridElem.appendChild(card);
                    const media = card.querySelectorAll('.carousel-media');
                    if(media.length > 1) {
                        let idx = 0;
                        setInterval(() => {
                            media[idx].classList.remove('active');
                            idx = (idx + 1) % media.length;
                            media[idx].classList.add('active');
                        }, 3000);
                    }
                });
            } catch(e) { console.error("Project load failed", e); }
        }
    </script>
</body>
</html>
