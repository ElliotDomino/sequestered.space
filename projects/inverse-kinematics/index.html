<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inverse Kinematics in JavaScript with P5</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to right, #e0f7fa, #e0f2f1);
            color: #333;
            padding: 2rem 1rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #006064;
            text-align: center;
        }

        body > p {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: #004d40;
            text-align: center;
        }

        #content {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
        }

        #sketch-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1rem;
        }

        #controls {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 2rem;
        }

        .control-group {
            width: 260px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
        }

        .control-group p {
            margin: 0 0 4px 0;
            text-align: center;
        }

        .control-group input[type="range"] {
            width: 100%;
        }

        canvas {
            display: block;
            border: 2px solid #004d40;
            background-color: white;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <h1>Inverse Kinematics!</h1>
    <p>CCD Inverse Kinematics implemented by Elliot Chrystal for practice using JavaScript</p>

    <div id="content">
      <div id="sketch-container"></div>
      <div id="controls"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="inverse-kinematics.js"></script>
</body>
</html>
